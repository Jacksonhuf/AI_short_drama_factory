name: Deploy Jellyfish to VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "front/**"
      - "deploy/docker/**"
      - "deploy/vps/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jellyfish-vps-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /opt/jellyfish
      DOMAIN: drama.xclawapi.com
      IMAGE_TAG: ${{ github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "${{ secrets.VPS_SSH_PRIVATE_KEY }}"

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Build backend image
        run: docker build --tag "jellyfish-backend:${IMAGE_TAG}" --file deploy/docker/backend.Dockerfile .

      - name: Build frontend image
        run: |
          docker build \
            --build-arg "VITE_BACKEND_URL=https://${DOMAIN}" \
            --tag "jellyfish-front:${IMAGE_TAG}" \
            --file deploy/docker/front.Dockerfile \
            .

      - name: Copy deployment configuration and SQL seeds
        run: |
          ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "command -v tar >/dev/null 2>&1 || dnf install -y tar; mkdir -p '${DEPLOY_PATH}'"
          tar -C deploy -czf - vps | ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "tar -xzf - -C '${DEPLOY_PATH}'"
          tar -C backend -czf - sql | ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "tar -xzf - -C '${DEPLOY_PATH}'"

      - name: Bootstrap Docker host
        run: |
          ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "bash '${DEPLOY_PATH}/vps/scripts/bootstrap-host.sh'"

      - name: Transfer container images
        run: |
          docker save "jellyfish-backend:${IMAGE_TAG}" "jellyfish-front:${IMAGE_TAG}" | gzip | \
            ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "gzip -d | docker load"

      - name: Deploy stack
        run: |
          ssh -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' IMAGE_TAG='${IMAGE_TAG}' DOMAIN='${DOMAIN}' \
              bash '${DEPLOY_PATH}/vps/scripts/deploy.sh'"
