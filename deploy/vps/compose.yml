name: jellyfish

x-backend-environment: &backend-environment
  DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  DEBUG: "false"
  API_V1_PREFIX: /api/v1
  CORS_ORIGINS: https://${DOMAIN}
  S3_ENDPOINT_URL: http://rustfs:9000
  S3_REGION_NAME: us-east-1
  S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
  S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_BASE_PATH: jellyfish
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      front:
        condition: service_healthy
    mem_limit: 64m

  mysql:
    image: mysql:9.0
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 96m

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs_data:/data
    mem_limit: 256m

  backend-init-db:
    image: jellyfish-backend:${JELLYFISH_IMAGE_TAG}
    restart: "no"
    environment: *backend-environment
    command: ["uv", "run", "python", "init_db.py"]
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m

  mysql-init-sql:
    image: mysql:9.0
    restart: "no"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ../sql:/sql:ro
    command:
      [
        "bash",
        "-lc",
        "set -e; for f in $$(find /sql -maxdepth 1 -type f -name '*.sql' | sort); do mysql --default-character-set=utf8mb4 -h mysql -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" < \"$$f\"; done",
      ]
    depends_on:
      mysql:
        condition: service_healthy
      backend-init-db:
        condition: service_completed_successfully
    mem_limit: 128m

  backend-init-storage:
    image: jellyfish-backend:${JELLYFISH_IMAGE_TAG}
    restart: on-failure:10
    environment: *backend-environment
    command: ["uv", "run", "python", "init_storage.py"]
    depends_on:
      rustfs:
        condition: service_started
    mem_limit: 256m

  backend:
    image: jellyfish-backend:${JELLYFISH_IMAGE_TAG}
    restart: unless-stopped
    environment: *backend-environment
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init-db:
        condition: service_completed_successfully
      mysql-init-sql:
        condition: service_completed_successfully
      backend-init-storage:
        condition: service_completed_successfully
    mem_limit: 384m

  celery-worker:
    image: jellyfish-backend:${JELLYFISH_IMAGE_TAG}
    restart: unless-stopped
    environment: *backend-environment
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.core.celery_app:celery_app",
        "worker",
        "-l",
        "info",
        "--concurrency=1",
        "--prefetch-multiplier=1",
      ]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init-db:
        condition: service_completed_successfully
      mysql-init-sql:
        condition: service_completed_successfully
      backend-init-storage:
        condition: service_completed_successfully
    mem_limit: 384m

  front:
    image: jellyfish-front:${JELLYFISH_IMAGE_TAG}
    restart: unless-stopped
    environment:
      BACKEND_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/env.js | grep -q BACKEND_URL"]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 64m

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  rustfs_data:
